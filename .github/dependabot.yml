# Dependabot proposes updates as pull requests; nothing is merged automatically. Each pull request
# runs the CI with a read-only token and no secrets, and is reviewed like any other change.
version: 2
updates:
  # The actions pinned by commit SHA in .github/workflows/ (Dependabot updates the SHA and the tag comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # NuGet packages referenced by the projects.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
